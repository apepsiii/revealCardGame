<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-50/70 via-slate-50 to-rose-50/50 min-h-screen flex items-center justify-center p-4 text-slate-800 antialiased">

  <div class="max-w-md w-full">
    
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-500 via-rose-600 to-amber-500 items-center justify-center shadow-lg shadow-rose-500/25 text-white font-black text-3xl mb-4">
        ♠
      </div>
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">
        Masuk Panel <span class="text-rose-600">Guru</span>
      </h1>
      <p class="text-sm text-slate-500 mt-1">
        Kelola kartu tantangan untuk kelas Anda dengan aman
      </p>
    </div>

    <!-- Card Form -->
    <div class="bg-white rounded-3xl p-7 sm:p-9 shadow-xl border border-slate-200/80 backdrop-blur-md">

      {{ if .HasError }}
      <div class="mb-5 p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-sm font-semibold flex items-center gap-2">
        <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        <span>Username atau password salah. Coba lagi!</span>
      </div>
      {{ end }}

      {{ if .LoggedOut }}
      <div class="mb-5 p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm font-semibold flex items-center gap-2">
        <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
        <span>Anda telah berhasil keluar (logout).</span>
      </div>
      {{ end }}

      <form action="/login" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
          <input 
            type="text" 
            name="username" 
            required 
            placeholder="admin" 
            value="admin"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 focus:outline-none text-sm font-medium transition-all"
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
          <input 
            type="password" 
            name="password" 
            required 
            placeholder="admin123" 
            value="admin123"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 focus:outline-none text-sm font-medium transition-all"
          >
        </div>

        <button 
          type="submit" 
          class="w-full py-3.5 rounded-xl font-black text-sm bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-600 hover:to-rose-700 text-white shadow-lg shadow-rose-500/25 active:scale-98 transition-all"
        >
          Masuk ke Dashboard ➔
        </button>
      </form>

      <!-- Info Kredensial Default -->
      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-400">
          Kredensial Default: <strong class="text-slate-600">admin</strong> / <strong class="text-slate-600">admin123</strong>
        </p>
      </div>

    </div>

    <!-- Back to Game link -->
    <div class="text-center mt-6">
      <a href="/" class="text-xs font-bold text-slate-500 hover:text-slate-800 transition-colors inline-flex items-center gap-1.5">
        ← Kembali ke Halaman Game Siswa
      </a>
    </div>

  </div>

</body>
</html>
